<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="flip.min.css" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            max-width: 100vw;
        }
        .tick {
            padding-bottom: 1em;
            font-size:1rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            margin-bottom: 30px;
        }
        
        .tick-label {
            font-size:.375em;
            display: none !important;
            text-align:center;
        }
    
        .tick-group {
            margin:0 .25em;
            text-align:center;
        }

        #greeting, #name {
            text-align: center;
        }

        #greeting {
           
            max-width: 100vw;
        }

        #greeting > img {
            margin: 25px 0;
            max-width: 75vw;
        }

        #name {
            font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
            font-size: 10vw;
            font-weight: 800;
            color: crimson;
        }

        #fireworks {
            width: 100%;
            text-align: center;
            background: black;
            padding: 25px 0 100px
        }

        #fireworks > img {
            max-width: 95vw;
        }
    </style>

</head>
<body>
    <div id="name">
        Sarah...
    </div>
    <div id="greeting">
        <img src="greeting.gif" alt="">
    </div>
    <div class="tick"
     data-did-init="handleTickInit">

    <div data-repeat="true"
         data-layout="horizontal center fit"
         data-transform="preset(d, h, m, s) -> delay">

        <div class="tick-group">

            <div data-key="value"
                 data-repeat="true"
                 data-transform="pad(00) -> split -> delay">

                <span data-view="flip"></span>

            </div>

            <span data-key="label"
                  data-view="text"
                  class="tick-label"></span>

                

        </div>

    </div>

</div>
<div id="fireworks">
    <img src="fireworks.gif" alt="">
</div>


<script src="flip.min.js"></script>

    <script>
	function handleTickInit(tick) {


        var countdownTo = (new Date('November 10, 2023' ));
        
		Tick.count.down(countdownTo).onupdate = function(value) {
            const val = 0.012743404363267378
            const totalValue = 365 * 24 * 60 * 60
            const hours = (value[0] * 24) + value[1]
            const minutes = (hours * 60) + value[2]
            const seconds = (minutes * 60) + value[3]
			tick.value = value;
        };

	}
</script>
</body>
</html>
